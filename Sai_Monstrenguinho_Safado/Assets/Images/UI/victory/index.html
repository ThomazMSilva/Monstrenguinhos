<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Victory Menu</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
</head>
<body>
    <div id="menu-container">
        <div id="logo">
            <img src="left-wing.png" alt="Left wing" class="wing" id="left-wing">
            <img src="victory-text.png" alt="Victory" id="logo-text">
            <img src="right-wing.png" alt="Right wing" class="wing" id="right-wing">
        </div>
        <nav id="main-menu">
            <ul>
                <li><button id="start-btn">PLAYER GAME</button></li>
                <li><button id="options-btn">Options</button></li>
                <li><button id="credits-btn">Credits</button></li>
            </ul>
        </nav>
    </div>
    <audio id="click-sound" src="click_sound.mp3" preload="auto"></audio>
    <script type="module" src="script.js"></script>
</body>
</html>
